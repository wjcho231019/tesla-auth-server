<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tesla 인증 처리 중...</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{background:#fff;border-radius:16px;padding:32px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.spin{display:inline-block;width:36px;height:36px;border:3px solid #f0f0f0;border-top:3px solid #e82127;border-radius:50%;animation:spin .9s linear infinite;margin-bottom:18px;}
@keyframes spin{to{transform:rotate(360deg);}}
h2{color:#111;font-size:17px;font-weight:600;margin-bottom:8px;}
p{color:#888;font-size:13px;line-height:1.6;}
.err{color:#e82127;}
.ok{color:#34c759;}
</style>
</head>
<body>
<div class="box">
<div class="spin" id="spin"></div>
<h2 id="title">Tesla 인증 처리 중...</h2>
<p id="msg">잠시만 기다려주세요.</p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');

if (code) {
  const fullUrl = window.location.href;
  const targetUrl = 'https://tesla-web-ui.onrender.com/auto_reauth?callback=' + encodeURIComponent(fullUrl);
  setTimeout(function(){ window.location.href = targetUrl; }, 500);
} else {
  document.getElementById('spin').style.display = 'none';
  document.getElementById('title').textContent = '오류';
  document.getElementById('title').className = 'err';
  document.getElementById('msg').textContent = '인증 코드를 찾을 수 없습니다.';
}
</script>
</body>
</html>
